esphome:
  name: bobson_colorchanger
  friendly_name: Bobson Colorchanger

wifi:
  ssid: "NETIASPOT-2wS8 2.4G"
  password: "KauMm8W33cDC4"

esp32:
  board: esp32dev
  framework:
    type: arduino

logger:

api:

ota:
  platform: esphome

web_server:

# ================= GLOBAL MECHANICAL CONFIG =================
substitutions:
  steps_per_cm: "95"
  line_length_cm: "80"

globals:
  - id: last_loaded_spool
    type: int
    restore_value: yes
    initial_value: "0"

# ================= STEPPERS =================
stepper:
  - platform: a4988
    id: spool1
    step_pin: GPIO14
    dir_pin: GPIO12
    sleep_pin: GPIO25
    max_speed: 500
    acceleration: 800
    deceleration: 800

  - platform: a4988
    id: spool2
    step_pin: GPIO27
    dir_pin: GPIO26
    sleep_pin: GPIO33
    max_speed: 500
    acceleration: 800
    deceleration: 800

# ================= SCRIPTS =================
script:
  - id: do_load
    parameters:
      stepper_id: stepper::Stepper*
      spool: int
    then:
      - lambda: |-
          int steps = ${steps_per_cm} * ${line_length_cm};
          stepper_id->set_target(steps);
      - delay: 2s
      - lambda: |-
          stepper_id->set_target(0);
          id(last_loaded_spool) = spool;

  - id: do_unload
    parameters:
      stepper_id: stepper::Stepper*
    then:
      - lambda: |-
          int steps = ${steps_per_cm} * ${line_length_cm};
          stepper_id->set_target(-steps);
      - delay: 2s
      - lambda: |-
          stepper_id->set_target(0);

# ================= BUTTONS =================
button:
  - platform: template
    name: "Spool 1 Load"
    on_press:
      - script.execute:
          id: do_load
          stepper_id: !lambda "return id(spool1);"
          spool: 1

  - platform: template
    name: "Spool 1 Unload"
    on_press:
      - script.execute:
          id: do_unload
          stepper_id: !lambda "return id(spool1);"

  - platform: template
    name: "Spool 2 Load"
    on_press:
      - script.execute:
          id: do_load
          stepper_id: !lambda "return id(spool2);"
          spool: 2

  - platform: template
    name: "Spool 2 Unload"
    on_press:
      - script.execute:
          id: do_unload
          stepper_id: !lambda "return id(spool2);"

# ================= COLOR METADATA =================
light:
  - platform: rgb
    name: "Spool 1 Color"
    red: spool1_r
    green: spool1_g
    blue: spool1_b

  - platform: rgb
    name: "Spool 2 Color"
    red: spool2_r
    green: spool2_g
    blue: spool2_b

output:
  - platform: template
    id: spool1_r
    type: float
    write_action: []

  - platform: template
    id: spool1_g
    type: float
    write_action: []

  - platform: template
    id: spool1_b
    type: float
    write_action: []

  - platform: template
    id: spool2_r
    type: float
    write_action: []

  - platform: template
    id: spool2_g
    type: float
    write_action: []

  - platform: template
    id: spool2_b
    type: float
    write_action: []
